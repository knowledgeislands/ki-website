# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

# =============================================================================

# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repository = "https://github.com/knowledgeislands/ki-website"
title = "KI Website"
description = "Public-facing portal for Knowledge Islands — shares project knowledge and links out to key resources."
repo_code = "KI-WEB"
supported_runtimes = ["claude-code", "claude-desktop", "chatgpt-codex"]
visibility = "public"
license = "MIT"

[skills.ki-authoring]

# -----------------------------------------------------------------------------
# Repository shape
# -----------------------------------------------------------------------------

[skills.ki-repo-project]

[skills.ki-repo-website]

[skills.ki-repo-website-content]

[skills.ki-repo-website-cloudflare]

# -----------------------------------------------------------------------------
# Governance and runtime
# -----------------------------------------------------------------------------

[skills.ki-engineering]

[skills.ki-decision-records]

[skills.ki-guides]

# -----------------------------------------------------------------------------
# Change management
# -----------------------------------------------------------------------------

[skills.ki-git]

[skills.ki-work]
adapter = "roadmap"

[skills.ki-work-roadmap]
themes = ["site-experience"]
areas.SITE = "site-experience"

[skills.ki-tokenomics]
headroom = "recommended"
preferred_model_type = "standard"
budgets.mcp_servers = 20 # User-scoped; revisit if the global MCP set is pruned.

[skills.ki-housekeeping-claude]

[skills.ki-tokenomics-claude]

[skills.ki-tokenomics-codex]

# -----------------------------------------------------------------------------
# Relationships
# -----------------------------------------------------------------------------

[skills.ki-trades]

[skills.ki-trades.subtypes.knowledge]
public-source-change = "Already-public committed KI source changes for documentation provenance review. Excludes unpublished or confidential material; grants no publication or deployment authority."

[skills.ki-trades.routes."knowledgeislands/ki-agentic-harness"]
export = ["work", "knowledge"]
import = ["knowledge"]

[skills.ki-trades.routes."knowledgeislands/ki-agentic-harness".standing.export]
knowledge = ["shared-capability-maintenance"]

[skills.ki-trades.routes."knowledgeislands/ki-agentic-harness".standing.import]
knowledge = ["public-source-change"]

[skills.ki-trades.routes."knowledgeislands/ki-arcadia-principal"]
import = ["knowledge"]

[skills.ki-trades.routes."knowledgeislands/ki-arcadia-principal".standing.import]
knowledge = ["public-source-change"]

[skills.ki-trades.routes."knowledgeislands/ki-specifications"]
import = ["knowledge"]

[skills.ki-trades.routes."knowledgeislands/ki-specifications".standing.import]
knowledge = ["public-source-change"]

[skills.ki-trades.routes."knowledgeislands/ki-techne-principal"]
import = ["knowledge"]

[skills.ki-trades.routes."knowledgeislands/ki-techne-principal".standing.import]
knowledge = ["public-source-change"]

[skills.ki-agora]
memberships.ki-all = { home = "https://github.com/knowledgeislands/ki-arcadia-principal", role = "product" }
memberships.ki-fnd = { home = "https://github.com/knowledgeislands/ki-arcadia-principal", role = "product" }
