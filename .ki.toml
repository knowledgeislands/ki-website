# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

# =============================================================================

# -----------------------------------------------------------------------------
# Foundation
# -----------------------------------------------------------------------------

[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repository = "https://github.com/knowledgeislands/ki-website"
title = "KI Website"
description = "Public-facing portal for Knowledge Islands — shares project knowledge and links out to key resources."
repo_code = "KI-WEB"
supported_runtimes = ["claude-code", "claude-desktop", "chatgpt-codex"]
visibility = "public"
license = "MIT"

[skills.ki-authoring]

# -----------------------------------------------------------------------------
# Repository shape
# -----------------------------------------------------------------------------

[skills.ki-repo-project]

[skills.ki-repo-website]

[skills.ki-repo-website-content]

[skills.ki-repo-website-cloudflare]

# -----------------------------------------------------------------------------
# Governance and runtime
# -----------------------------------------------------------------------------

[skills.ki-engineering]

[skills.ki-decision-records]

[skills.ki-guides]

# -----------------------------------------------------------------------------
# Change management
# -----------------------------------------------------------------------------

[skills.ki-git]

[skills.ki-work]
adapter = "roadmap"

[skills.ki-work-roadmap]
themes = ["site-experience"]
areas.SITE = "site-experience"

[skills.ki-tokenomics]
headroom = "recommended"
preferred_model_type = "standard"
budgets.mcp_servers = 20 # User-scoped; revisit if the global MCP set is pruned.

[skills.ki-housekeeping-claude]

[skills.ki-tokenomics-claude]

[skills.ki-tokenomics-codex]

# -----------------------------------------------------------------------------
# Relationships
# -----------------------------------------------------------------------------

[skills.ki-trades]
routes."knowledgeislands/ki-arcadia-principal" = { import = ["knowledge"] }
routes."knowledgeislands/ki-agentic-harness" = { import = ["knowledge"] }
routes."knowledgeislands/ki-specifications" = { import = ["knowledge"] }
routes."knowledgeislands/ki-techne-principal" = { import = ["knowledge"] }

[skills.ki-agora]
memberships.ki-all = { home = "https://github.com/knowledgeislands/ki-agentic-harness", role = "maintainer" }
memberships.ki-fnd = { home = "https://github.com/knowledgeislands/ki-agentic-harness", role = "maintainer" }
